# Text of the homepage, section by section.
# Lists (services, projects, talks, ...) live in their own files in this folder.
# Plain text only (just type & where you need an ampersand).

hero:
  heading: Railway data that connects.
  greeting: "I'm Mathias,"            # followed by the typed roles from roles.yml
  intro: >-
    MatData helps infrastructure managers and railway undertakings turn scattered
    asset, network and operational data into connected, standards-based knowledge —
    from data strategy to systems in production.
  image: /assets/img/hero-bg.jpg
  image_alt: Mathias Vanden Auweele presenting at the ERA Railway Data Forum 2024 in Verona
  primary_cta: { label: Get in touch, url: "#contact" }
  secondary_cta: { label: Explore the expertise graph, url: "https://expertise.matdata.eu" }

expertise:
  eyebrow: Expertise
  heading: Two specialisms, one junction
  intro: >-
    Most data consultants know data. Most railway engineers know the railway.
    MatData works where the two meet — so the model fits the infrastructure,
    and the infrastructure data fits the model.

services:
  eyebrow: Services
  heading: From business idea to production

projects:
  eyebrow: Projects
  heading: Things I've built
  intro: Open-source tools for railway data and Linked Data. Both run live, so you can try them right now.
  all_link: { label: See all my repositories on GitHub →, url: "https://github.com/orgs/Matdata-eu/repositories" }

products:
  eyebrow: Products
  heading: More from the tools
  intro: >-
    Both tools are open source and free to use. When you need them on your own infrastructure,
    tailored to your data or backed by support, MatData builds and runs it for you.
  cta: { label: Ask about these services →, url: "#contact" }

example:
  eyebrow: Linked Data, in railway terms
  heading: From track to knowledge graph
  paragraphs:
    - >-
      One small station, seen as a topology, as a knowledge graph, on a schematic and on a map,
      then aggregated to meso and macro level. Nothing is re-entered: every view comes from the
      same net elements and relations.
    - >-
      Timetables, infrastructure registers and maintenance systems each keep their own copy of a
      station. Give the operational point one identifier and a shared meaning, and every system
      points at the same place.

track_record:
  eyebrow: Track record
  heading: Sixteen years on one network
  intro: "Two master's degrees in engineering, both magna cum laude: Energy at KU Leuven, Electromechanics at GroepT Leuven."
  cv: { label: Download CV (PDF), url: "https://expertise.matdata.eu/static/Mathias_Vanden_Auweele_CV.pdf" }

