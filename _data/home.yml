about:
  eyebrow: About
  heading: Hi, I'm Mathias
  image: /assets/img/profile-img-400.jpg
  image_alt: Portrait of Mathias Vanden Auweele
  text: >-
    For sixteen years I worked on Infrabel's infrastructure data — from catenary measurements
    and European working groups to leading the data-centricity team. With MatData I bring that
    experience to railway organisations that want their data to connect, inside the company
    and across borders.
  location: Based between Brussels and Leuven, working across Europe.

